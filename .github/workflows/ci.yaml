name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standard-ci:
    name: Standard CI
    uses: kanedasec/platform-workflows/.github/workflows/ci-python-node.yaml@463bfd537c536a12c8479b4b1b8ff712a4dc0b21
    with:
      python_version: "3.12"
      python_working_directory: backend
      python_requirements_file: requirements-dev.txt
      python_cache_dependency_path: |
        backend/requirements.txt
        backend/requirements-dev.txt
      python_test_path: tests
      node_version: "22"
      node_working_directory: frontend
      node_lockfile: frontend/package-lock.json
      node_run_tests: false
      node_build_script: build
