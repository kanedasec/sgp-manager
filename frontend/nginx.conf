# Trust X-Forwarded-For/X-Real-IP only from the private/internal address
# ranges a legitimate upstream edge proxy (Caddy in production) can
# actually connect from -- never from the public internet. This mirrors
# the same trust boundary already used for the backend's own
# --forwarded-allow-ips (see backend/Dockerfile). Without this, nginx's
# own $remote_addr (its immediate TCP peer) is always the edge proxy
# itself, never the real client, in any topology with an edge in front
# of nginx.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $request_uri $secpipe_content_security_policy {
    default "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    ~^/(docs|redoc)(/|\?|$) "default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://cdn.jsdelivr.net; img-src data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "$secpipe_content_security_policy" always;

    location ~ ^/(api|health|ready|metrics|docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr here is NOT necessarily the raw TCP peer: the
        # ngx_http_realip_module config above rewrites it to the resolved
        # real client IP whenever the immediate connecting peer is in the
        # trusted set_real_ip_from ranges (i.e. Caddy in production),
        # walking back through a chained X-Forwarded-For via
        # real_ip_recursive. For any connection from an UNTRUSTED peer
        # (the raw public internet hitting nginx directly, bypassing
        # Caddy) $remote_addr is left as that peer's own real address, so
        # a client cannot forge X-Forwarded-For to spoof a different IP --
        # only a request that actually arrived via a trusted proxy gets
        # its forwarded value trusted. Deliberately overwriting (not
        # appending via $proxy_add_x_forwarded_for) keeps this single
        # resolved value as the only one the backend ever sees, so a
        # client-supplied X-Forwarded-For riding alongside a trusted
        # proxy's own value can never poison what the backend receives
        # once combined with --forwarded-allow-ips.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Content-Security-Policy;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
